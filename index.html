<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Theory | Music & Links</title>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables & Theme Setup */
        :root {
            --bg-dark: #05020a;
            --violet-deep: #120326;
            --violet-card: rgba(22, 8, 38, 0.85);
            --violet-border: rgba(157, 78, 221, 0.35);
            --violet-glow: #a855f7;
            --violet-bright: #c77dff;
            --text-main: #f3e8ff;
            --text-muted: #a78bfa;
            --term-header: #1a0b2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        /* Animated Canvas Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Linux Terminal Container */
        .terminal-window {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: var(--violet-card);
            border: 1px solid var(--violet-border);
            border-radius: 12px;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.2), 0 15px 35px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            animation: fadeIn 0.8s ease-out;
        }

        /* Terminal Window Bar */
        .terminal-header {
            background: var(--term-header);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--violet-border);
        }

        .window-controls {
            display: flex;
            gap: 8px;
        }

        .control-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .btn-close { background-color: #ff5f56; }
        .btn-minimize { background-color: #ffbd2e; }
        .btn-maximize { background-color: #27c93f; }

        .terminal-title {
            margin: 0 auto;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            padding-right: 48px; /* Optical centering compensation */
        }

        /* Terminal Body */
        .terminal-body {
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Profile Section */
        .profile-container {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }

        .profile-img-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 16px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--violet-glow);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        .artist-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(199, 125, 255, 0.5);
        }

        .command-prompt {
            font-size: 0.78rem;
            color: var(--text-muted);
            word-break: break-all;
        }

        .prompt-user { color: #c084fc; }
        .prompt-host { color: #38bdf8; }
        .prompt-cmd { color: #4ade80; }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: var(--violet-bright);
            vertical-align: middle;
            animation: blink 1s infinite;
        }

        /* Streaming Links */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .stream-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(18, 3, 38, 0.7);
            border: 1px solid var(--violet-border);
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stream-link:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--violet-glow);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(168, 85, 247, 0.25);
        }

        .platform-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .platform-info i {
            font-size: 1.3rem;
            width: 24px;
            text-align: center;
        }

        .action-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--violet-bright);
            background: rgba(168, 85, 247, 0.15);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(199, 125, 255, 0.2);
        }

        /* Circular Social Media Buttons */
        .socials-header {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .social-links {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(18, 3, 38, 0.8);
            border: 1px solid var(--violet-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn:hover {
            background: var(--violet-glow);
            color: #ffffff;
            transform: scale(1.15) rotate(6deg);
            box-shadow: 0 0 18px var(--violet-bright);
            border-color: var(--violet-bright);
        }

        /* Specific Brand Icon Colors on Hover */
        .fa-spotify { color: #1DB954; }
        .fa-apple { color: #FA243C; }
        .fa-deezer { color: #A238FF; }
        .fa-youtube { color: #FF0000; }
        .fa-amazon { color: #FF9900; }

        .stream-link:hover i {
            color: #ffffff !important;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Particle Background -->

    <!-- JavaScript Particle Engine -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width, height, particles;

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            particles = [];
            // Adjust particle count based on screen size
            const particleCount = Math.floor((width * height) / 12000);

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: (Math.random() - 0.5) * 0.6,
                    radius: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.6 + 0.2
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                // Bounce from edges
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                // Draw Particle
                ctx.fillStyle = `rgba(168, 85, 247, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();

                // Draw connecting lines between nearby particles
                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p.x - p2.x;
                    let dy = p.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 100) {
                        ctx.strokeStyle = `rgba(157, 78, 221, ${0.2 * (1 - dist / 100)})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animateParticles);
        }

        // Initialize and handle window resize
        initCanvas();
        animateParticles();

        window.addEventListener('resize', () => {
            initCanvas();
        });
    </script>
